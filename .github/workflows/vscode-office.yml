name: VS Code workbook extension
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/vscode-office/**'
      - 'packages/workbook-session/**'
      - 'packages/sheets-editor/**'
      - 'packages/xlsx-gateway/**'
      - 'apps/sheets/native/**'
      - 'package-lock.json'
      - '.github/workflows/vscode-office.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: '"ubuntu-22.04"'
          # These labels require provisioned runners with the exact acceptance OS.
          # Windows Server and an Intel Mac are not substitutes for these gates.
          - target: win32-x64
            runner: '["self-hosted", "Windows", "X64", "Windows11"]'
          - target: darwin-arm64
            runner: '["self-hosted", "macOS", "ARM64", "macOS14"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Record compiler versions
        run: |
          mkdir -p apps/vscode-office/artifacts
          rustc -Vv > apps/vscode-office/artifacts/toolchain.txt
          cargo -V >> apps/vscode-office/artifacts/toolchain.txt
          node -v >> apps/vscode-office/artifacts/toolchain.txt
          python3 --version >> apps/vscode-office/artifacts/toolchain.txt
      - run: npm ci
      - run: npm run native:build -w apps/vscode-office
      - run: npm run vscode:build
      - run: npm run vscode:typecheck
      - run: npm run vscode:test
      - run: npm run native:test -w @genoffice/sheets
      - run: npm run licenses
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check licenses
          manifest-path: apps/sheets/native/xlsx-engine/Cargo.toml
      - name: Native minimum and current stable VS Code
        run: |
          if [ "${{ matrix.target }}" = linux-x64 ]; then
            xvfb-run -a npm run test:integration -w apps/vscode-office -- --label minimum --fail-zero
            xvfb-run -a npm run test:integration -w apps/vscode-office -- --label stable --fail-zero
          else
            npm run test:integration -w apps/vscode-office -- --label minimum --fail-zero
            npm run test:integration -w apps/vscode-office -- --label stable --fail-zero
          fi
      - run: npm run notices
      - run: npm run package -w apps/vscode-office -- ${{ matrix.target }}
      - name: Install VSIX in clean profiles, minimum and stable
        run: |
          if [ "${{ matrix.target }}" = linux-x64 ]; then
            xvfb-run -a npm run test:package -w apps/vscode-office
            xvfb-run -a npm run test:package -w apps/vscode-office -- stable
          else
            npm run test:package -w apps/vscode-office
            npm run test:package -w apps/vscode-office -- stable
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: workbook-${{ matrix.target }}
          path: |
            apps/vscode-office/artifacts
            apps/vscode-office/test-results
          retention-days: 14
# No credentials, Marketplace publishing or automatic deployment.
